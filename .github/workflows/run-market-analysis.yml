name: Run market analysis

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Internal execution identity
        required: true
        type: string
      access_token:
        description: Opaque capability token (do not print)
        required: true
        type: string

concurrency:
  group: market-analysis-run
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Mark run running
        env:
          ACCESS_TOKEN: ${{ inputs.access_token }}
        run: |
          python -m src.live_run_publish \
            --run-id "$RUN_ID" \
            --access-token "$ACCESS_TOKEN" \
            --set-status running \
            --message "Running analysis."

      - name: Execute Python pipeline
        id: analyze
        env:
          ACCESS_TOKEN: ${{ inputs.access_token }}
        run: |
          set +e
          python -m src.main \
            --run-id "$RUN_ID" \
            --export-run-bundle
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "pipeline_exit=$code"

      - name: Publish run bundle
        env:
          ACCESS_TOKEN: ${{ inputs.access_token }}
        run: |
          python -m src.live_run_publish \
            --run-id "$RUN_ID" \
            --access-token "$ACCESS_TOKEN" \
            --bundle-dir "outputs/${RUN_ID}/bundle" \
            --pipeline-exit "${{ steps.analyze.outputs.exit_code }}"
