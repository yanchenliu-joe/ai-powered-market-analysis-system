[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-powered-market-analysis"
version = "0.1.0"
description = "A staged system for quantitative U.S. market analysis and AI-assisted interpretation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "yfinance>=0.2.40,<2.0",
    "pandas-datareader>=0.10,<1.0",
    "statsmodels>=0.14,<1.0",
    "scipy>=1.11,<2.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "openai>=1.40,<3.0",
    "pydantic>=2.7,<3.0",
    "PyYAML>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "reportlab>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "responses>=0.25,<1.0",
    "ruff>=0.6,<1.0",
    "black>=24.0,<27.0",
]

[project.scripts]
market-analysis = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
target-version = ["py311"]
line-length = 88
